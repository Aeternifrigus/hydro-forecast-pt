[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydro-forecast-ch"
version = "0.1.0"
description = "Weekly run-of-river hydropower generation forecasting for Switzerland (4 basins: Rhine, Rhône, Inn, Ticino)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "aeternifrigus", email = "aeternifrigus@proton.me"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.1.0",
    "torch>=2.1.0",
    "pytorch-lightning>=2.1.0",
    "pytorch-forecasting>=1.6.0",
    "statsmodels>=0.14.0",
    "xarray>=2023.10.0",
    "rioxarray>=0.14.0",
    "rasterio>=1.3.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "entsoe-py>=0.5.0",
    "cdsapi>=0.7.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "mlflow>=2.8.0",
    "dvc>=3.0.0",
    "dvc-s3>=3.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.17.0",
    "streamlit>=1.28.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "click>=8.1.0",
    "rich>=13.5.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.5.0",
    "optuna>=3.4.0",
    "skgarden>=0.2.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/username/hydro-forecast-pt"
Repository = "https://github.com/username/hydro-forecast-pt"
Issues = "https://github.com/username/hydro-forecast-pt/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hydro_forecast_pt*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=hydro_forecast_pt --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "UP", "W", "C90", "ANN", "T20", "PTH", "PL", "TRY", "ARG", "SIM"]
ignore = ["ANN101", "ANN102", "ARG001", "ARG002", "PTH123", "SIM103"]
per-file-ignores = ["tests/*:S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/hydro_forecast_pt"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pre-commit]
default_stages = ["commit"]
